<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Profile Ready — intake</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1917;
      --muted: #57534e;
      --line: #d6d3d1;
      --paper: #fafaf9;
      --card: #ffffff;
      --accent: #1e3a2f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Georgia, "Iowan Old Style", "Palatino Linotype", serif;
      color: var(--ink);
      background: var(--paper);
      line-height: 1.45;
    }
    main {
      max-width: 40rem;
      margin: 0 auto;
      padding: 2rem 1.25rem 3rem;
    }
    h1 {
      font-size: 1.75rem;
      line-height: 1.2;
      margin: 0 0 0.35rem;
    }
    .who {
      margin: 0 0 1rem;
      color: var(--muted);
    }
    .note {
      background: var(--card);
      border: 1px solid var(--line);
      padding: 0.85rem 1rem;
      margin: 0 0 1.5rem;
    }
    form {
      display: grid;
      gap: 0.9rem;
    }
    label {
      display: grid;
      gap: 0.3rem;
      font-size: 0.98rem;
    }
    .hint {
      color: var(--muted);
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
    }
    input, textarea {
      font: 1rem/1.4 system-ui, sans-serif;
      color: var(--ink);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 2px;
      padding: 0.5rem 0.6rem;
      width: 100%;
    }
    textarea { min-height: 6.5rem; resize: vertical; }
    button {
      font: 600 1rem/1.2 system-ui, sans-serif;
      color: #fff;
      background: var(--accent);
      border: 0;
      padding: 0.75rem 1rem;
      cursor: pointer;
    }
    button:focus-visible, input:focus-visible, textarea:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    #status {
      min-height: 1.4rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <h1>Profile Ready</h1>
    <p class="who">Intake for one location. Kenneth Farrell, Ireland. €149 once per location, introductory. This page does not take payment.</p>
    <p class="note">Submit only saves <strong>case.txt</strong> on this computer. Nothing is sent over the network. This does not create or edit a Google listing, and it does not email anyone.</p>
    <form id="intake" action="#" method="post" novalidate>
      <label>
        Business name
        <span class="hint">Trading name or legal name, as the owner wants it shown.</span>
        <input name="business_name" id="business_name" autocomplete="organization" required>
      </label>
      <label>
        Town
        <span class="hint">The town this location serves or sits in.</span>
        <input name="town" id="town" required>
      </label>
      <label>
        Category in their words
        <span class="hint">What they would call the business. Not a Google category yet.</span>
        <input name="category" id="category" required>
      </label>
      <label>
        Phone
        <span class="hint">Number to display. Leave blank if they have not given one.</span>
        <input name="phone" id="phone" autocomplete="tel">
      </label>
      <label>
        Website
        <span class="hint">Leave blank if they have no website.</span>
        <input name="website" id="website" autocomplete="url">
      </label>
      <label>
        Hours
        <span class="hint">Days and times they gave. Write Closed where they are closed.</span>
        <textarea name="hours" id="hours"></textarea>
      </label>
      <label>
        Services they offer
        <span class="hint">One service per line, in their words. Only what they actually do.</span>
        <textarea name="services" id="services" required></textarea>
      </label>
      <label>
        Their email
        <span class="hint">Where a later handover would go. This form does not send mail.</span>
        <input name="email" id="email" type="email" autocomplete="email" required>
      </label>
      <button type="submit">Download case.txt</button>
      <p id="status" role="status"></p>
    </form>
  </main>
  <script>
    (function () {
      var form = document.getElementById("intake");
      var status = document.getElementById("status");

      function val(id) {
        var el = document.getElementById(id);
        var text = (el.value || "").replace(/\r\n/g, "\n").trim();
        return text.length ? text : "(not supplied)";
      }

      function stamp() {
        var d = new Date();
        function pad(n) { return String(n).padStart(2, "0"); }
        return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate())
          + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + " (local)";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();
        status.textContent = "";
        if (!form.reportValidity()) {
          status.textContent = "Fill the required fields. Nothing was saved.";
          return;
        }
        var lines = [
          "Profile Ready — intake",
          "Kenneth Farrell, Ireland",
          "Price noted: EUR 149 once per location (introductory). This file is not a payment.",
          "Saved on this computer only. Not sent. Not a Google listing edit.",
          "",
          "Saved: " + stamp(),
          "",
          "Business name: " + val("business_name"),
          "Town: " + val("town"),
          "Category in their words: " + val("category"),
          "Phone: " + val("phone"),
          "Website: " + val("website"),
          "Email: " + val("email"),
          "",
          "Hours:",
          val("hours"),
          "",
          "Services they offer:",
          val("services"),
          ""
        ];
        var blob = new Blob([lines.join("\n")], { type: "text/plain;charset=utf-8" });
        var url = URL.createObjectURL(blob);
        var link = document.createElement("a");
        link.href = url;
        link.download = "case.txt";
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
        status.textContent = "Saved case.txt on this computer. Nothing was sent.";
      });
    }());
  </script>
</body>
</html>
